# Builds ready to run programs for macOS and Linux, on Intel and ARM, so a stranger can
# install Ally without Rust. A version tag such as v0.1.0 publishes them as a GitHub release.
# Running it by hand, or a pull request that changes it, builds them without a release.
name: Release

on:
  push:
    tags: ["v*"]
  pull_request:
    paths: [.github/workflows/release.yml]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Version matches the tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "ally-cli") | .version')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "The tag $GITHUB_REF_NAME does not match version $version in Cargo.toml. Tag v$version instead."
            exit 1
          fi
      - name: musl tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Runs
        if: matrix.target != 'x86_64-apple-darwin'
        run: target/${{ matrix.target }}/release/ally --version
      - name: Package
        run: |
          tar -czf ally-${{ matrix.target }}.tar.gz -C target/${{ matrix.target }}/release ally
          shasum -a 256 ally-${{ matrix.target }}.tar.gz > ally-${{ matrix.target }}.tar.gz.sha256
      - uses: actions/upload-artifact@v7
        with:
          name: ally-${{ matrix.target }}
          path: ally-${{ matrix.target }}.tar.gz*

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: ally-*
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" ally-* --repo "$GITHUB_REPOSITORY" --generate-notes
