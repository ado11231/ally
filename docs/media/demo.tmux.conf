# The split screen for demo.tape: the Agent on top, the Client below. The prefix is Ctrl A,
# so Ctrl B reaches the Slingshot session inside the bottom pane. Each pane keeps its own
# color, blue for the Agent and purple for the Client, whichever one is active.
set -g prefix C-a
unbind C-b
set -g status off
set -g mouse off
set -g default-terminal "tmux-256color"
set -g allow-set-title off
set -g pane-border-status top
set -g pane-border-format "#{?#{==:#{pane_index},0},#[fg=#4da3ff],#[fg=#e070ff]} #{pane_title} "
set -g pane-border-style "#{?#{==:#{pane_index},0},fg=#4da3ff,fg=#e070ff}"
set -g pane-active-border-style "#{?#{==:#{pane_index},0},fg=#4da3ff,fg=#e070ff}"
